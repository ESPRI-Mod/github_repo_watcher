[project]
name = "github-repo-watcher"
version = "0.1.0"
description = "Consistency checker for WCRP climate vocabulary repositories against the esgvoc registry."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "esgvoc>=1.2.0",
    "gitpython>=3.1.45",
    "prefect[github]<3.3",
    "pyyaml>=6.0.2",
    "requests>=2.32.5",
    "typer>=0.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "ruff>=0.8.0",
]

[project.scripts]
check = "repo_watcher.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_watcher"]

[tool.ruff]
lint.select = ["ALL"]
lint.ignore = [
    "T20",  # print statements used for CLI output and warnings
    "D4",   # docstring section formatting
    "D200", # one-line docstring fit
    "D202", # blank line after docstring
    "D212", # multi-line docstring start
]
line-length = 120
