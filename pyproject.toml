[project]
name = "github-repo-watcher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "esgvoc>=1.2.0",
    "gitpython>=3.1.45",
    "griffe>=1.14.0",
    "prefect[github]<3.3",
    "pytest>=9.0.1",
    "pyyaml>=6.0.2",
    "requests>=2.32.5",
]

[tool.ruff]
lint.select = ["ALL"]
lint.ignore = [
    "T20", # T20 to ignore the "print statement found" warning, which is common in pre-commit hooks
    "D4",  # to ignore docstring formatting
    "D200",
    "D202",
    "D212",
]
line-length = 176
