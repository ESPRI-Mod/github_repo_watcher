# Generalized Consistency Watcher
#
# Runs generate-missing for every project in repos_config.yml.
# All PRs target esgvoc_dev:
#   - Most projects: community main -> esgvoc_dev -> esgvoc -> registry
#   - CMIP7 / Obs4REF: esgvoc_dev -> main -> registry
# In both cases, generated terms are PRed into esgvoc_dev.

name: Consistency Watcher

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Checkout watcher repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: List projects from config
        id: list
        run: |
          MATRIX=$(uv run check list-projects)
          echo "matrix={\"include\":$MATRIX}" >> "$GITHUB_OUTPUT"

  check-and-generate:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    env:
      GH_TOKEN: ${{ secrets.WATCHER_GITHUB_TOKEN }}

    steps:
      # ── Setup ──────────────────────────────────────────────
      - name: Checkout watcher repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Configure git identity
        run: |
          git config --global user.name "repo-watcher[bot]"
          git config --global user.email "repo-watcher[bot]@users.noreply.github.com"

      # ── Clone target repos on esgvoc_dev ──────────────────
      - name: Clone WCRP-universe
        run: |
          git clone --branch esgvoc_dev \
            "https://x-access-token:${GH_TOKEN}@github.com/WCRP-CMIP/WCRP-universe.git" \
            WCRP-universe

      - name: Clone project repo
        run: |
          git clone --branch esgvoc_dev \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ matrix.owner }}/${{ matrix.repo }}.git" \
            "${{ matrix.repo }}"

      # ── Run the watcher ───────────────────────────────────
      - name: Generate missing terms for ${{ matrix.project }}
        run: |
          uv run check generate-missing ${{ matrix.project }} \
            --universe-repo ./WCRP-universe \
            --write-universe ./WCRP-universe \
            --write-project  ./${{ matrix.repo }} \
            --summary-file   ./summary.json

      # ── PR titles and bodies from the run summary ─────────
      # summary.json lists per repo which steps planned changes
      # ("generic" and/or "metadata_profile") plus notices.
      - name: Prepare PR texts
        run: |
          P="${{ matrix.project }}"
          mkdir -p pr
          for REPO in universe project; do
            STEPS=" $(jq -r ".${REPO} | join(\" \")" summary.json) "
            if [ "$REPO" = universe ]; then WHAT="universe terms"; else WHAT="project links"; fi
            TITLE=""
            [[ "$STEPS" == *" generic "* ]] && TITLE="add missing $P $WHAT"
            if [[ "$STEPS" == *" metadata_profile "* ]]; then
              TITLE="${TITLE:+$TITLE and sync metadata}"
              TITLE="${TITLE:-sync $P metadata}"
            fi
            echo "feat: ${TITLE:-add missing $P $WHAT}" > "pr/${REPO}_title.txt"
            {
              echo "## Summary"
              echo "Auto-generated by the [Consistency Watcher](https://github.com/ESPRI-Mod/github_repo_watcher) CI."
              echo "This PR is automatically updated daily if new changes are detected."
              if [[ "$STEPS" != *" metadata_profile "* || "$STEPS" == *" generic "* ]]; then
                echo
                echo "### Missing terms"
                echo "Missing $WHAT were detected for **$P**."
                echo "These skeleton files need to be reviewed — **fill in placeholder values** before merging."
                echo "- [ ] Check that generated term IDs are correct"
                echo "- [ ] Fill in placeholder descriptions and fields"
                echo "- [ ] Verify no duplicates with existing terms"
              fi
              if [[ "$STEPS" == *" metadata_profile "* ]]; then
                echo
                echo "### Metadata sync"
                echo "Project metadata for **$P** was synced from the conventional CV (metadata profile)."
                echo "- [ ] Check the synced values against the conventional CV"
              fi
              if [ "$(jq '.notices | length' summary.json)" -gt 0 ]; then
                echo
                echo "### Notices (manual check needed)"
                jq -r '.notices[] | "- " + .' summary.json
              fi
            } > "pr/${REPO}_body.md"
          done

      # ── Create PR for WCRP-universe ───────────────────────
      - name: PR for WCRP-universe
        run: |
          cd WCRP-universe
          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice::No new universe terms to add for ${{ matrix.project }}."
            exit 0
          fi

          BRANCH="watcher/${{ matrix.project }}-universe"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "$(cat ../pr/universe_title.txt)" \
            -m "Auto-generated by github_repo_watcher CI on $(date -u +%Y-%m-%dT%H:%M:%SZ)."

          git push --force origin "$BRANCH"

          # Create the PR, or refresh title and body of the existing one
          EXISTING=$(gh pr list --repo WCRP-CMIP/WCRP-universe \
            --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            gh pr edit "$BRANCH" --repo WCRP-CMIP/WCRP-universe \
              --title "$(cat ../pr/universe_title.txt)" --body-file ../pr/universe_body.md
            echo "::notice::PR already exists — branch force-pushed, title and body refreshed."
            exit 0
          fi

          gh pr create \
            --repo WCRP-CMIP/WCRP-universe \
            --base esgvoc_dev \
            --head "$BRANCH" \
            --title "$(cat ../pr/universe_title.txt)" \
            --body-file ../pr/universe_body.md

      # ── Create PR for project repo ────────────────────────
      - name: PR for ${{ matrix.owner }}/${{ matrix.repo }}
        run: |
          cd "${{ matrix.repo }}"
          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice::No new project terms to add for ${{ matrix.project }}."
            exit 0
          fi

          BRANCH="watcher/${{ matrix.project }}-project"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "$(cat ../pr/project_title.txt)" \
            -m "Auto-generated by github_repo_watcher CI on $(date -u +%Y-%m-%dT%H:%M:%SZ)."

          git push --force origin "$BRANCH"

          EXISTING=$(gh pr list --repo "${{ matrix.owner }}/${{ matrix.repo }}" \
            --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            gh pr edit "$BRANCH" --repo "${{ matrix.owner }}/${{ matrix.repo }}" \
              --title "$(cat ../pr/project_title.txt)" --body-file ../pr/project_body.md
            echo "::notice::PR already exists — branch force-pushed, title and body refreshed."
            exit 0
          fi

          gh pr create \
            --repo "${{ matrix.owner }}/${{ matrix.repo }}" \
            --base esgvoc_dev \
            --head "$BRANCH" \
            --title "$(cat ../pr/project_title.txt)" \
            --body-file ../pr/project_body.md
