# Generalized Consistency Watcher
#
# Runs generate-missing for every project in repos_config.yml.
# All PRs target esgvoc_dev:
#   - Most projects: community main -> esgvoc_dev -> esgvoc -> registry
#   - CMIP7 / Obs4REF: esgvoc_dev -> main -> registry
# In both cases, generated terms are PRed into esgvoc_dev.

name: Consistency Watcher

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Checkout watcher repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: List projects from config
        id: list
        run: |
          MATRIX=$(uv run check list-projects)
          echo "matrix={\"include\":$MATRIX}" >> "$GITHUB_OUTPUT"

  check-and-generate:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    env:
      GH_TOKEN: ${{ secrets.WATCHER_GITHUB_TOKEN }}

    steps:
      # ── Setup ──────────────────────────────────────────────
      - name: Checkout watcher repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Configure git identity
        run: |
          git config --global user.name "repo-watcher[bot]"
          git config --global user.email "repo-watcher[bot]@users.noreply.github.com"

      # ── Clone target repos on esgvoc_dev ──────────────────
      - name: Clone WCRP-universe
        run: |
          git clone --branch esgvoc_dev \
            "https://x-access-token:${GH_TOKEN}@github.com/WCRP-CMIP/WCRP-universe.git" \
            WCRP-universe

      - name: Clone project repo
        run: |
          git clone --branch esgvoc_dev \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ matrix.owner }}/${{ matrix.repo }}.git" \
            "${{ matrix.repo }}"

      # ── Run the watcher ───────────────────────────────────
      - name: Generate missing terms for ${{ matrix.project }}
        run: |
          uv run check generate-missing ${{ matrix.project }} \
            --universe-repo ./WCRP-universe \
            --write-universe ./WCRP-universe \
            --write-project  ./${{ matrix.repo }}

      # ── Create PR for WCRP-universe ───────────────────────
      - name: PR for WCRP-universe
        run: |
          cd WCRP-universe
          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice::No new universe terms to add for ${{ matrix.project }}."
            exit 0
          fi

          BRANCH="watcher/${{ matrix.project }}-universe"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "feat: add missing ${{ matrix.project }} universe terms

          Auto-generated by github_repo_watcher CI on $(date -u +%Y-%m-%dT%H:%M:%SZ).
          Review the generated skeletons and fill in placeholder values."

          git push --force origin "$BRANCH"

          # Only create PR if one doesn't already exist for this branch
          EXISTING=$(gh pr list --repo WCRP-CMIP/WCRP-universe \
            --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "::notice::PR already exists — branch updated via force-push."
            exit 0
          fi

          gh pr create \
            --repo WCRP-CMIP/WCRP-universe \
            --base esgvoc_dev \
            --head "$BRANCH" \
            --title "feat: add missing ${{ matrix.project }} universe terms" \
            --body "$(cat <<'EOF'
          ## Summary
          Auto-generated by the [Consistency Watcher](https://github.com/ESPRI-Mod/github_repo_watcher) CI.

          Missing universe terms were detected for **${{ matrix.project }}**.
          These skeleton files need to be reviewed — **fill in placeholder values** before merging.

          This PR is automatically updated daily if new terms are detected.

          ## Review checklist
          - [ ] Check that generated term IDs are correct
          - [ ] Fill in placeholder descriptions and fields
          - [ ] Verify no duplicates with existing terms
          EOF
          )"

      # ── Create PR for project repo ────────────────────────
      - name: PR for ${{ matrix.owner }}/${{ matrix.repo }}
        run: |
          cd "${{ matrix.repo }}"
          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice::No new project terms to add for ${{ matrix.project }}."
            exit 0
          fi

          BRANCH="watcher/${{ matrix.project }}-project"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "feat: add missing ${{ matrix.project }} project links

          Auto-generated by github_repo_watcher CI on $(date -u +%Y-%m-%dT%H:%M:%SZ).
          Review the generated skeletons and fill in placeholder values."

          git push --force origin "$BRANCH"

          EXISTING=$(gh pr list --repo "${{ matrix.owner }}/${{ matrix.repo }}" \
            --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "::notice::PR already exists — branch updated via force-push."
            exit 0
          fi

          gh pr create \
            --repo "${{ matrix.owner }}/${{ matrix.repo }}" \
            --base esgvoc_dev \
            --head "$BRANCH" \
            --title "feat: add missing ${{ matrix.project }} project links" \
            --body "$(cat <<'EOF'
          ## Summary
          Auto-generated by the [Consistency Watcher](https://github.com/ESPRI-Mod/github_repo_watcher) CI.

          Missing project link files were detected for **${{ matrix.project }}**.
          These skeleton files need to be reviewed — **fill in placeholder values** before merging.

          This PR is automatically updated daily if new terms are detected.

          ## Review checklist
          - [ ] Check that generated term IDs are correct
          - [ ] Fill in placeholder descriptions and fields
          - [ ] Verify no duplicates with existing terms
          EOF
          )"
