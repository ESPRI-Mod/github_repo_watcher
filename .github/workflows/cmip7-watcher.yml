name: CMIP7 Consistency Watcher

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  check-and-generate:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.WATCHER_GITHUB_TOKEN }}

    steps:
      # ── Setup ──────────────────────────────────────────────
      - name: Checkout watcher repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Configure git identity
        run: |
          git config --global user.name "repo-watcher[bot]"
          git config --global user.email "repo-watcher[bot]@users.noreply.github.com"

      # ── Clone target repos on esgvoc_dev ──────────────────
      - name: Clone WCRP-universe
        run: |
          git clone --branch esgvoc_dev \
            "https://x-access-token:${GH_TOKEN}@github.com/WCRP-CMIP/WCRP-universe.git" \
            WCRP-universe

      - name: Clone CMIP7-CVs
        run: |
          git clone --branch esgvoc_dev \
            "https://x-access-token:${GH_TOKEN}@github.com/WCRP-CMIP/CMIP7-CVs.git" \
            CMIP7-CVs

      # ── Run the watcher ───────────────────────────────────
      - name: Generate missing terms for CMIP7
        run: |
          uv run check generate-missing cmip7 \
            --universe-repo ./WCRP-universe \
            --write-universe ./WCRP-universe \
            --write-project  ./CMIP7-CVs

      # ── Create PR for WCRP-universe ───────────────────────
      - name: PR for WCRP-universe
        run: |
          cd WCRP-universe
          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice::No new universe terms to add."
            exit 0
          fi

          BRANCH="watcher/cmip7-universe-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "feat: add missing CMIP7 universe terms

          Auto-generated by github_repo_watcher CI on $(date -u +%Y-%m-%dT%H:%M:%SZ).
          Review the generated skeletons and fill in placeholder values."

          git push origin "$BRANCH"

          # Skip if a PR from this branch already exists
          EXISTING=$(gh pr list --repo WCRP-CMIP/WCRP-universe \
            --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "::notice::PR already exists for $BRANCH"
            exit 0
          fi

          gh pr create \
            --repo WCRP-CMIP/WCRP-universe \
            --base esgvoc_dev \
            --head "$BRANCH" \
            --title "feat: add missing CMIP7 universe terms ($(date +%Y-%m-%d))" \
            --body "$(cat <<'EOF'
          ## Summary
          Auto-generated by the [CMIP7 Consistency Watcher](https://github.com/ESPRI-Mod/github_repo_watcher) CI.

          Missing terms were detected between EMD / CMIP7-CVs and the esgvoc registry.
          These skeleton files need to be reviewed — **fill in placeholder values** before merging.

          ## Review checklist
          - [ ] Check that generated term IDs are correct
          - [ ] Fill in placeholder descriptions and fields
          - [ ] Verify no duplicates with existing terms
          EOF
          )"

      # ── Create PR for CMIP7-CVs ───────────────────────────
      - name: PR for CMIP7-CVs
        run: |
          cd CMIP7-CVs
          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice::No new CMIP7 project terms to add."
            exit 0
          fi

          BRANCH="watcher/cmip7-project-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "feat: add missing CMIP7 project links

          Auto-generated by github_repo_watcher CI on $(date -u +%Y-%m-%dT%H:%M:%SZ).
          Review the generated skeletons and fill in placeholder values."

          git push origin "$BRANCH"

          EXISTING=$(gh pr list --repo WCRP-CMIP/CMIP7-CVs \
            --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "::notice::PR already exists for $BRANCH"
            exit 0
          fi

          gh pr create \
            --repo WCRP-CMIP/CMIP7-CVs \
            --base esgvoc_dev \
            --head "$BRANCH" \
            --title "feat: add missing CMIP7 project links ($(date +%Y-%m-%d))" \
            --body "$(cat <<'EOF'
          ## Summary
          Auto-generated by the [CMIP7 Consistency Watcher](https://github.com/ESPRI-Mod/github_repo_watcher) CI.

          Missing project link files were detected between EMD / CMIP7-CVs and the esgvoc registry.
          These skeleton files need to be reviewed — **fill in placeholder values** before merging.

          ## Review checklist
          - [ ] Check that generated term IDs are correct
          - [ ] Fill in placeholder descriptions and fields
          - [ ] Verify no duplicates with existing terms
          EOF
          )"
