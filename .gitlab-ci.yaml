default:
    tags:
       - IPSL
       - docker

# included templates
include:
  # Gitleaks template
  - component: "$CI_SERVER_FQDN/ipsl/espri/ci-catalogs/to-be-continuous/gitleaks/gitlab-ci-gitleaks@2.9"
  # Python template
  - component: "$CI_SERVER_FQDN/ipsl/espri/ci-catalogs/to-be-continuous/python/gitlab-ci-python@9.2"
    inputs:
      ruff-enabled: true
      ruff-format-enabled: true
      ty-enabled: true